<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indiana University Bloomington</title>

<!--
  ===========================================================================
  Navigation Test Bloomington — Rivet sidebar navigation prototype
  Single-file, no-build prototype: HTML + CSS + vanilla JS with a hash router
  (home is #/).

  WHERE EVERYTHING CAME FROM
  --------------------------
  Page layout : Figma "Sidebar Designs" (file aNuo3VFJJcb2ca1umElvkI), frame
                "Homepage" 5:12499: the header, the 260px sidebar, the order of
                the sections, the section padding and all copy.
  Components  : the Rivet 3 Component Guide
                (manselldesign.github.io/rivet-component-guide). Every
                component's inner spacing, type, hover and focus follows its
                Developer spec checklist and the guide's built examples.
  Tokens      : assets/rivet-tokens.css is a copy of the guide's
                generated/rivet-tokens.css. Mobile values switch below 768px
                inside that file. Crimson sections use .rvt-theme-crimson.
  Behavior    : prototype-hub/v1.1/sidebar-v2-children (sidebar model).

  WHERE TO EDIT
  -------------
  IA            : the `IA` array in the script at the bottom of this file.
  Homepage copy : <template id="tpl-home">.
  SIDENAV_BREAKPOINT : 1024px, the desktop / mobile split. It appears in the
                script and in the `1024px` / `1023.98px` media queries.
  --content-max : 1340px, the Figma main-content frame.
  ===========================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@200..900&family=Roboto+Flex:opsz,slnt,wdth,wght@8..144,-10..0,25..151,100..1000&family=Roboto+Mono:wght@300..700&display=swap">
<link rel="stylesheet" href="assets/rivet-tokens.css">

<style>
  /* =========================================================================
     PAGE SETUP
     The token file has no font families; these point it at the Rivet fonts.
     ========================================================================= */
  :root {
    --rvt-font-family-sans: 'Roboto Flex', system-ui, sans-serif;
    --rvt-font-family-mono: 'Roboto Mono', ui-monospace, monospace;
    --rvt-font-family-serif: 'Crimson Pro', Georgia, serif;
    --sidenav-width: 260px;
    --sidenav-pad: 24px;
    --content-max: 1340px;          /* Figma main-content frame */
    --gutter: 48px;                 /* page side padding in the Sidebar Figma file */
    --section-y: var(--rvt-spacing-128);   /* 128 Desktop, 96 at the token's Mobile value; overridden below 768 */
    --chrome-h: 69px;               /* live header height, set from JS */
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--rvt-background-default);
    color: var(--rvt-text-default);
    font: var(--rvt-font-body-sm-regular);
    font-stretch: var(--rvt-font-width-semi-expanded);
    -webkit-font-smoothing: antialiased;
    text-wrap: pretty;              /* no single word alone on a last line (guide: no orphans) */
  }
  h1, h2, h3, p, ul, figure, blockquote { margin: 0; padding: 0; }
  h1, h2, h3 { text-wrap: balance; }
  ul { list-style: none; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  img, svg { display: block; }
  img { max-width: 100%; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--rvt-border-accent-strong); outline-offset: 2px; }
  .icon { flex: none; width: 16px; height: 16px; }
  .icon-12 { flex: none; width: 12px; height: 12px; }
  .icon svg, .icon-12 svg { width: 100%; height: 100%; fill: currentColor; }

  .skip-link { position: absolute; left: -9999px; top: 0; z-index: 100; background: var(--rvt-background-inverse); color: var(--rvt-text-inverse); padding: 12px 16px; }
  .skip-link:focus { left: 0; }

  /* =========================================================================
     TEXT STYLES (guides/text-styles.md)
     Each token shorthand sets weight, size/line height and family; the width
     and axes follow it, as the token file says.
     ========================================================================= */
  .t-display-xl-caps { font: var(--rvt-font-display-xl-caps); font-stretch: var(--rvt-font-width-normal); font-variation-settings: var(--rvt-font-axes-display-caps); text-transform: uppercase; }
  .t-display-lg { font: var(--rvt-font-display-lg-strong); font-stretch: var(--rvt-font-width-normal); font-variation-settings: var(--rvt-font-axes-heading); }
  .t-display-md { font: var(--rvt-font-display-md-strong); font-stretch: var(--rvt-font-width-normal); font-variation-settings: var(--rvt-font-axes-heading); }
  .t-display-xs { font: var(--rvt-font-display-xs-strong); font-stretch: var(--rvt-font-width-normal); font-variation-settings: var(--rvt-font-axes-heading); }
  .t-body-xl   { font: var(--rvt-font-body-xl-regular); font-stretch: var(--rvt-font-width-semi-expanded); }
  .t-body-md   { font: var(--rvt-font-body-md-regular); font-stretch: var(--rvt-font-width-semi-expanded); }
  .t-body-base { font: var(--rvt-font-body-base-regular); font-stretch: var(--rvt-font-width-semi-expanded); }
  .t-body-sm   { font: var(--rvt-font-body-sm-regular); font-stretch: var(--rvt-font-width-semi-expanded); }
  .t-body-sm-strong { font: var(--rvt-font-body-sm-strong); font-stretch: var(--rvt-font-width-semi-expanded); }
  .t-action-xl-fixed { font: var(--rvt-font-action-xl-strong-fixed); font-stretch: var(--rvt-font-width-semi-expanded); }
  .t-action-lg { font: var(--rvt-font-action-lg-strong); font-stretch: var(--rvt-font-width-semi-expanded); }
  .t-action-sm { font: var(--rvt-font-action-sm-strong); font-stretch: var(--rvt-font-width-semi-expanded); }
  .t-action-sm-regular { font: var(--rvt-font-action-sm-regular); font-stretch: var(--rvt-font-width-semi-expanded); }
  .t-number    { font: var(--rvt-font-component-number-strong); font-stretch: 150%; text-box: trim-both cap alphabetic; }
  .t-editorial-xl { font: var(--rvt-font-editorial-xl-regular); }
  .t-editorial-sm { font: var(--rvt-font-editorial-sm-regular); }
  .t-tag-lg     { font: var(--rvt-font-tag-lg-regular); letter-spacing: var(--rvt-font-tracking-lg); }
  .t-tag-md     { font: var(--rvt-font-tag-md-regular); letter-spacing: var(--rvt-font-tracking-lg); }
  .t-tag-md-caps{ font: var(--rvt-font-tag-md-caps); letter-spacing: var(--rvt-font-tracking-xl); text-transform: uppercase; }
  .t-tag-sm     { font: var(--rvt-font-tag-sm-regular); letter-spacing: var(--rvt-font-tracking-lg); }
  .t-tag-sm-caps{ font: var(--rvt-font-tag-sm-caps); letter-spacing: var(--rvt-font-tracking-xl); text-transform: uppercase; }

  /* =========================================================================
     rvt-link (Link page): Normal style. Extra-large in content, Medium in the header.
     1px border/accent drawn inside. Hover: border/accent-strong, text/brand-strong,
     icon/accent-strong (150ms). Focus: 2px border/accent-strong, 2px outside.
     No pressed state. Arrow follows the link type (Internal right, External up-right).
     ========================================================================= */
  .rvt-link {
    display: inline-flex; align-items: center; gap: var(--rvt-spacing-8); flex: none;
    height: var(--rvt-component-button-height-xl); padding: 0 var(--rvt-spacing-16);
    box-shadow: inset 0 0 0 1px var(--rvt-border-accent); color: var(--rvt-text-accent); white-space: nowrap;
    font: var(--rvt-font-action-lg-strong); font-stretch: var(--rvt-font-width-semi-expanded);
    transition: box-shadow .15s ease-out, color .15s ease-out;
  }
  .rvt-link .icon, .rvt-link .icon-12 { color: var(--rvt-icon-accent); transition: color .15s ease-out; }
  .rvt-link:hover { box-shadow: inset 0 0 0 1px var(--rvt-border-accent-strong); color: var(--rvt-text-brand-strong); }
  .rvt-link:hover .icon, .rvt-link:hover .icon-12 { color: var(--rvt-icon-accent-strong); }
  .rvt-link--md {
    height: var(--rvt-component-button-height-md); padding: 0 var(--rvt-spacing-12);
    font: var(--rvt-font-action-sm-strong); font-stretch: var(--rvt-font-width-semi-expanded);
  }
  .actions-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--rvt-spacing-16); }

  /* rvt-button Icon only, Normal, Medium (header search and menu): 32 × 32, 1px form border,
     16px icon (12px on Mobile). Hover: form-border-hover and form-text-hover (150ms). */
  .tool-btn {
    display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: none; padding: 0; cursor: pointer;
    border: 1px solid var(--rvt-component-button-form-border); background: transparent; color: var(--rvt-component-button-form-text);
    transition: border-color .15s ease-out, color .15s ease-out;
  }
  .tool-btn:hover { border-color: var(--rvt-component-button-form-border-hover); color: var(--rvt-component-button-form-text-hover); }
  .tool-btn .when-open { display: none; }
  .tool-btn[aria-expanded="true"] .when-open { display: block; }
  .tool-btn[aria-expanded="true"] .when-closed { display: none; }

  /* =========================================================================
     HEADER — full viewport width (Figma 5:12500, rvt-header)
     ========================================================================= */
  .chrome { position: sticky; top: 0; z-index: 70; background: var(--rvt-background-default); }
  .site-header {
    display: flex; align-items: center; justify-content: space-between; gap: var(--rvt-spacing-16);
    padding: var(--rvt-spacing-12) var(--rvt-spacing-24);
    background: var(--rvt-background-default);
    border-bottom: 1px solid var(--rvt-border-default);
  }
  /* Logo lockup, Campus: 6px mark to text, 1px top padding, lines 2px apart (Header page). */
  .lockup { display: flex; align-items: center; gap: 6px; height: 44px; flex: none; color: var(--rvt-text-strong); }
  .lockup img { width: 37px; height: 44px; }
  .lockup-text { display: flex; flex-direction: column; gap: 2px; padding-top: 1px; text-transform: uppercase; white-space: nowrap; }
  .lockup-title { font: var(--rvt-font-component-lockup-campus-title); font-stretch: 40%; font-variation-settings: "opsz" 16; color: var(--rvt-text-strong); }
  .lockup-campus { font: var(--rvt-font-component-lockup-campus-name); font-stretch: 40%; font-variation-settings: "opsz" 20; color: var(--rvt-text-default); }
  /* Buttons spacing/8 apart (Header page). */
  .header-tools { display: flex; align-items: center; gap: var(--rvt-spacing-8); }
  .header-ctas { display: flex; align-items: center; gap: var(--rvt-spacing-8); }
  #sidenav-open { display: none; }

  /* Search: slides open in flow under the header, same 400ms ease as the menu. */
  #search-panel {
    max-height: 0; overflow: hidden; visibility: hidden; background: var(--rvt-background-default);
    transition: max-height 400ms var(--ease), box-shadow 400ms var(--ease);
  }
  #search-panel.is-open { visibility: visible; box-shadow: 0 2px 6px 0 rgba(0, 0, 0, 0.15); }
  .search-inner { padding: var(--rvt-spacing-24); }
  .search-form {
    display: flex; align-items: center; gap: var(--rvt-spacing-8); height: 48px; padding-left: var(--rvt-spacing-12);
    box-shadow: inset 0 0 0 1px var(--rvt-component-button-form-border); max-width: 533px; margin-left: auto;
  }
  .search-form:focus-within { outline: 2px solid var(--rvt-border-accent-strong); outline-offset: 2px; }
  .search-form input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--rvt-text-strong); font: var(--rvt-font-body-sm-regular); font-stretch: var(--rvt-font-width-semi-expanded); }
  .search-go {
    height: 48px; padding: 0 var(--rvt-spacing-16); border: 0; cursor: pointer;
    background: var(--rvt-component-button-form-background); color: var(--rvt-text-on-brand-alt);
    font: var(--rvt-font-action-lg-strong); font-stretch: var(--rvt-font-width-semi-expanded);
    transition: background-color .15s ease-out;
  }
  .search-go:hover { background: var(--rvt-component-button-form-background-hover); }

  /* =========================================================================
     LAYOUT — sidebar locked left, content centered in the remaining space
     ========================================================================= */
  #layout { display: flex; flex: 1; width: 100%; }
  .rail { flex: none; width: var(--sidenav-width); box-shadow: inset -1px 0 0 var(--rvt-border-default); background: var(--rvt-background-default); }
  #content-column { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #main-content { flex: 1; }
  #main-content:focus { outline: none; }
  /* Each band's background runs the full width of the content column; its
     contents stop at the Figma max width and center. */
  .wrap { width: 100%; max-width: var(--content-max); margin-inline: auto; }
  /* A themed band paints its own background/default fill and text color. */
  .rvt-theme-crimson { background: var(--rvt-background-default); color: var(--rvt-text-default); }

  /* =========================================================================
     SIDENAV (Figma 5:12507; behavior from sidebar-v2-children; states from the
     guide's rail, which is the same sidenav)
     Rows: 12px top/bottom on a 44px pitch, 1px border/default under each.
     Top level: action/sm/strong. Children: action/sm/regular.
     Current: text/accent + underline. Hover and focus: label underlined,
     label and chevron text/brand-strong.
     ========================================================================= */
  #sidenav {
    position: sticky; top: var(--chrome-h);
    max-height: calc(100vh - var(--chrome-h)); overflow-y: auto;
    padding: var(--sidenav-pad) var(--sidenav-pad) 64px;
  }
  #sidenav-nav { padding-top: 28px; }
  #sidenav-nav .sidenav-after-back { padding-top: 20px; }
  #sidenav .nav-btn-back {
    display: flex; width: max-content; max-width: 100%; align-items: center; gap: 8px; height: 24px;
    border: 0; padding: 0; background: transparent; color: var(--rvt-text-strong); cursor: pointer;
    font: var(--rvt-font-action-sm-strong); font-stretch: var(--rvt-font-width-semi-expanded);
  }
  #sidenav .nav-btn-back .icon { width: 14px; height: 14px; }
  #sidenav .nav-btn-back:hover { color: var(--rvt-text-brand-strong); }
  #sidenav a.sidenav-title {
    display: flex; width: 100%; align-items: center; gap: 8px;
    margin-top: 14px; padding-bottom: 12px; box-shadow: inset 0 -1px 0 var(--rvt-border-default);
    color: var(--rvt-text-accent); font: var(--rvt-font-action-sm-strong); font-stretch: var(--rvt-font-width-semi-expanded);
  }
  #sidenav a.sidenav-title .sidenav-title-label { flex: 1; min-width: 0; text-decoration: underline; text-underline-position: from-font; }
  #sidenav a.sidenav-title:hover { color: var(--rvt-text-brand-strong); }
  #sidenav .sidenav-title-arrow { display: none; }
  #sidenav .sidenav-item {
    display: flex; width: 100%; align-items: center; gap: 8px;
    padding: 12px 0 13px; margin: 0; border: 0; box-shadow: inset 0 -1px 0 var(--rvt-border-default);
    background: transparent; text-align: left; cursor: pointer; color: var(--rvt-text-strong);
  }
  #sidenav-nav ul > li { margin-bottom: -1px; }
  #sidenav .sidenav-item-label { flex: 1; min-width: 0; }
  #sidenav .sidenav-item-label.is-parent { font: var(--rvt-font-action-sm-strong); font-stretch: var(--rvt-font-width-semi-expanded); }
  #sidenav .sidenav-item-label.is-child { font: var(--rvt-font-action-sm-regular); font-stretch: var(--rvt-font-width-semi-expanded); }
  #sidenav .sidenav-item.is-current { color: var(--rvt-text-accent); }
  #sidenav .sidenav-item.is-current .sidenav-item-label { text-decoration: underline; text-underline-position: from-font; }
  #sidenav .sidenav-item:focus-visible { color: var(--rvt-text-brand-strong); outline-offset: -2px; }
  #sidenav .sidenav-item:focus-visible .sidenav-item-label { text-decoration: underline; text-underline-position: from-font; }
  @media (hover: hover) {
    #sidenav .sidenav-item:hover { color: var(--rvt-text-brand-strong); }
    #sidenav .sidenav-item:hover .sidenav-item-label { text-decoration: underline; text-underline-position: from-font; }
  }

  /* =========================================================================
     rvt-hero-statement (Hero statement page), Crimson
     Text block spacing/128 top, spacing/48 bottom; body spacing/24 above.
     Card (rvt-card-hero): component/hero/background, shadow/sm, spacing/16 padding,
     48px sticker spacing/8 from the text, title action/lg/strong.
     ========================================================================= */
  .hero { background: var(--rvt-background-default); color: var(--rvt-text-default); }
  .hero .wrap { padding: 0 var(--gutter) var(--rvt-spacing-40); }
  .hero-text { padding: var(--rvt-spacing-128) 0 var(--rvt-spacing-48); text-align: center; }
  .hero-text h1 { color: var(--rvt-text-brand); }
  .hero-intro { max-width: 1000px; margin: 0 auto; padding-top: var(--rvt-spacing-24); color: var(--rvt-text-default); }
  .hero-media { position: relative; }
  .hero-media img { width: 100%; height: auto; aspect-ratio: 2 / 1; object-fit: cover; object-position: var(--rvt-image-focus, 50% 0%); }
  .hero-card {
    position: absolute; right: 0; bottom: 0; width: 700px; max-width: 100%;
    display: flex; align-items: flex-start; gap: var(--rvt-spacing-8); padding: var(--rvt-spacing-16);
    background: var(--rvt-component-hero-background); box-shadow: var(--rvt-shadow-sm);
  }
  .hero-card img { width: 48px; height: 48px; flex: none; }
  .hero-card p { flex: 1; min-width: 0; padding-top: var(--rvt-spacing-4); color: var(--rvt-color-base-ultra-light); }

  /* =========================================================================
     rvt-stat (Stat group page), Crimson
     Group: 1px border/default. Stats: spacing/64 top and bottom, spacing/32 sides,
     1px border/default dividers; spacing/48 side padding around the stats.
     64px sticker, spacing/24 to the number, spacing/16 number to text.
     Note: spacing/80 sides (here the page gutter + 32, so it lines up with the stats).
     ========================================================================= */
  .stat { background: var(--rvt-background-default); color: var(--rvt-text-brand); box-shadow: inset 0 -1px 0 var(--rvt-border-default); }
  .stat-row { box-shadow: inset 0 1px 0 var(--rvt-border-default), inset 0 -1px 0 var(--rvt-border-default); }
  .stat-row .wrap { display: flex; padding: 0 var(--gutter); }
  .stat-item { flex: 1 0 0; min-width: 0; display: flex; flex-direction: column; gap: var(--rvt-spacing-24); padding: var(--rvt-spacing-64) var(--rvt-spacing-32); box-shadow: inset -1px 0 0 var(--rvt-border-default); }
  .stat-item:first-child { padding-left: 0; }
  .stat-item:last-child { padding-right: 0; box-shadow: none; }
  .stat-item img { width: 64px; height: 64px; }
  .stat-item div { display: flex; flex-direction: column; gap: var(--rvt-spacing-16); }
  .stat-note { padding: var(--rvt-spacing-16) var(--rvt-spacing-80) var(--rvt-spacing-16) var(--gutter); color: var(--rvt-text-accent); }

  /* =========================================================================
     rvt-section-intro, Default (Section intro default page)
     Meta spacing/12 below; title display/md/strong; body body/base/regular,
     spacing/16 above; title and body up to 920px. Text to button spacing/64
     (side by side) or spacing/40 (centered, stacked). Intro to cards spacing/40;
     cards spacing/40 apart. Section padding: the page's 128 top and bottom.
     ========================================================================= */
  .section { background: var(--rvt-background-default); }
  .section .wrap { display: flex; flex-direction: column; gap: var(--rvt-spacing-40); padding: var(--section-y) var(--gutter); }
  .section-head { display: flex; align-items: flex-end; justify-content: flex-end; gap: var(--rvt-spacing-64); }
  .section-head-text { flex: 1 0 0; min-width: 0; }
  .section-head-text .eyebrow { padding-bottom: var(--rvt-spacing-12); color: var(--rvt-text-brand); }
  .section-head-text h2 { color: var(--rvt-text-brand); }
  .section-head-text h2, .section-head-text p { max-width: 920px; }
  .section-head-text .t-body-base { padding-top: var(--rvt-spacing-16); color: var(--rvt-text-default); }
  .section-actions { flex: none; display: flex; justify-content: flex-end; }
  .section--news .wrap { padding-top: 96px; }  /* Figma Homepage: this intro starts at 96 */
  .section--center .wrap { padding-inline: var(--rvt-spacing-80); }
  .section--center .section-head { flex-direction: column; align-items: center; gap: var(--rvt-spacing-40); text-align: center; }
  .section--center .section-head-text { flex: none; width: 100%; }
  .section--center .section-head-text h2, .section--center .section-head-text p { margin-inline: auto; }
  .card-row { display: flex; align-items: stretch; gap: var(--rvt-spacing-40); }
  .card-row > * { flex: 1 0 0; min-width: 0; }

  /* =========================================================================
     rvt-card-feature, Vertical, Image (Card feature page + built example)
     background/raised, 1px border/default drawn inside and on top of the picture.
     Image 3:2 edge to edge. Text spacing/32 all sides. Title display/xs/strong
     text/brand; description body/sm/regular, spacing/16 above, stops spacing/8
     before the arrow box (16px in from the right padding edge).
     Arrow box spacing/40 square, bottom-right, 1px border/default top and left,
     16px arrow icon/brand, decorative.
     Hover only on the title text or the arrow box: title text/accent + underline,
     arrow box fills background/tint. Instant. Focus: 2px ring right outside the card.
     ========================================================================= */
  .card-feature { --cf-pad: var(--rvt-spacing-32); --cf-arrow: var(--rvt-spacing-40);
    position: relative; display: flex; flex-direction: column; background: var(--rvt-background-raised); }
  .card-feature::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; box-shadow: inset 0 0 0 1px var(--rvt-border-default); }
  .card-feature:has(.card-feature__link:focus-visible) { outline: 2px solid var(--rvt-border-accent-strong); outline-offset: 0; }
  .card-feature__media { position: relative; flex: none; aspect-ratio: 3 / 2; }
  .card-feature__media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--rvt-image-focus, 50% 0%); }
  .card-feature__body { display: flex; flex-direction: column; min-width: 0; padding: var(--cf-pad); }
  .card-feature__title { color: var(--rvt-text-brand); }
  .card-feature__link { color: inherit; }
  .card-feature__link-text { position: relative; z-index: 2; }
  .card-feature__link::after { content: ""; position: absolute; inset: 0; z-index: 1; }
  .card-feature__link:focus-visible { outline: none; }
  .card-feature__desc { padding-top: var(--rvt-spacing-16); color: var(--rvt-text-default); overflow-wrap: break-word; }
  .card-feature__body > :last-child { padding-right: calc(var(--cf-arrow) - var(--rvt-spacing-32) + var(--rvt-spacing-8)); }
  .card-feature__arrow {
    position: absolute; right: 0; bottom: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
    width: var(--cf-arrow); height: var(--cf-arrow); box-shadow: inset 1px 1px 0 0 var(--rvt-border-default); color: var(--rvt-icon-brand);
  }
  .card-feature__link:has(.card-feature__link-text:hover, .card-feature__arrow:hover) .card-feature__link-text { color: var(--rvt-text-accent); text-decoration: underline; }
  .card-feature__link:has(.card-feature__link-text:hover, .card-feature__arrow:hover) .card-feature__arrow { background: var(--rvt-background-tint); }

  /* =========================================================================
     rvt-card-news, Vertical, Outlined (Card news page)
     1px border/default, background/raised, spacing/32 padding. Image 3:2, spacing/32
     below. Top metadata tag/sm/regular text/brand, spacing/4 below. Title
     editorial/sm/regular text/strong; arrow 16px, spacing/16 from the title, 7px
     from the top (External link, so rvt-arrow-up-right). Bottom group spacing/24
     above; metadata tag/sm/regular text/default.
     Hover only on the title text: text/accent + underline, instant.
     ========================================================================= */
  .card-news { position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: var(--rvt-spacing-32);
    background: var(--rvt-background-raised); box-shadow: inset 0 0 0 1px var(--rvt-border-default); }
  .card-news:has(.card-news__link:focus-visible) { outline: 2px solid var(--rvt-border-accent-strong); outline-offset: 0; }
  .card-news__media { aspect-ratio: 3 / 2; margin-bottom: var(--rvt-spacing-32); }
  .card-news__media img { width: 100%; height: 100%; object-fit: cover; object-position: var(--rvt-image-focus, 50% 0%); }
  .card-news__meta { display: block; padding: 0 0 var(--rvt-spacing-4) 2px; color: var(--rvt-text-brand); }
  .card-news__head { display: flex; align-items: flex-start; gap: var(--rvt-spacing-16); }
  .card-news__title { flex: 1 0 0; min-width: 0; color: var(--rvt-text-strong); }
  .card-news__link-text { position: relative; z-index: 2; }
  .card-news__link::after { content: ""; position: absolute; inset: 0; z-index: 1; }
  .card-news__link:focus-visible { outline: none; }
  .card-news__link-text:hover { color: var(--rvt-text-accent); text-decoration: underline; }
  .card-news__head .icon { margin-top: 7px; color: var(--rvt-icon-strong); }
  .card-news__bottom { padding-top: var(--rvt-spacing-24); color: var(--rvt-text-default); }

  /* =========================================================================
     rvt-callout, Strong, Left (Callout page + built example)
     background/strong, spacing/80 padding, 80px sticker, spacing/32 to the text
     column (max 850px, spacing/8 above). Eyebrow tag/sm/caps spacing/8 below;
     title display/xs/strong; description body/sm/regular text/brand, spacing/20
     above; links Normal XL, spacing/32 above, spacing/16 apart.
     ========================================================================= */
  .callout-band .wrap { padding: 0 var(--gutter) var(--section-y); }
  .callout { display: flex; align-items: flex-start; justify-content: center; gap: var(--rvt-spacing-32); padding: var(--rvt-spacing-80);
    background: var(--rvt-background-strong); color: var(--rvt-text-brand); }
  .callout > img { width: 80px; height: 80px; flex: none; }
  .callout-body { flex: 1 1 0; min-width: 0; max-width: 850px; padding-top: var(--rvt-spacing-8); overflow-wrap: break-word; }
  .callout-body .t-tag-sm-caps { padding: 0 0 var(--rvt-spacing-8) 2px; }
  .callout-body .t-body-sm { padding-top: var(--rvt-spacing-20); }
  .callout-body .actions-row { padding-top: var(--rvt-spacing-32); }

  /* =========================================================================
     rvt-billboard, one image + list of links (Billboard page + built example)
     Side by side when the billboard is 800px wide or more: image column 66%,
     content at least 280px, spacing/32 between, content bottom-aligned.
     Image 1:1, spacing/24 top, bottom and outer side, cropped from the top centre.
     Content spacing/48 outer side and bottom (spacing/32 under 1100px wide).
     Eyebrow spacing/8 below, description spacing/16 above, links spacing/32 above.
     Stacked under 800px: image 3:2 full width, spacing/20 top and sides; text and
     links inside one spacing/32 (24px) frame; Mobile type sizes.
     ========================================================================= */
  .billboard-band .wrap { padding: 0 var(--gutter); }
  .billboard-wrap { container-type: inline-size; }
  .billboard { display: grid; grid-template-columns: minmax(0, 66%) minmax(280px, 1fr); column-gap: var(--rvt-spacing-32); align-items: end; background: var(--rvt-background-strong); }
  .billboard__media { padding: var(--rvt-spacing-24) 0 var(--rvt-spacing-24) var(--rvt-spacing-24); }
  .billboard__media img { width: 100%; max-width: 900px; height: auto; aspect-ratio: 1 / 1; object-fit: cover; object-position: var(--rvt-image-focus, 50% 0%); }
  .billboard__content { min-width: 0; padding: 0 var(--rvt-spacing-48) var(--rvt-spacing-48) 0; overflow-wrap: break-word; }
  .billboard__eyebrow { padding: 0 0 var(--rvt-spacing-8) 2px; color: var(--rvt-text-brand); }
  .billboard__title { color: var(--rvt-text-brand); }
  .billboard__desc { padding-top: var(--rvt-spacing-16); color: var(--rvt-text-default); }
  .billboard__actions { padding-top: var(--rvt-spacing-32); }
  @container (max-width: 1099px) {
    .billboard__content { padding: 0 var(--rvt-spacing-32) var(--rvt-spacing-32) 0; }
  }
  @container (max-width: 799px) {
    .billboard { display: flex; flex-direction: column; align-items: stretch;
      --rvt-spacing-32: 24px; --rvt-spacing-64: 48px; --rvt-type-size-26: 20px; --rvt-type-line-height-24-32: 24px; }
    .billboard__media { padding: var(--rvt-spacing-20) var(--rvt-spacing-20) 0; }
    .billboard__media img { aspect-ratio: 3 / 2; max-width: none; }
    .billboard__content { padding: 0; }
    .billboard__text { padding: var(--rvt-spacing-32); }
    .billboard__title { font-size: var(--rvt-type-size-26); line-height: var(--rvt-type-line-height-24-32); }
    .billboard__actions { padding: 0 var(--rvt-spacing-32) var(--rvt-spacing-32); }
  }

  /* rvt-list-hub, Compact, title only (billboard links and interior child links):
     1px border/default above the first item and between items, none below the last.
     Items spacing/12 top and bottom (the last one top only); 12px arrow icon/strong
     in a 16 × 24 slot, spacing/4 to the title; title action/lg/strong text/strong.
     Hover: title text/accent + underline, arrow icon/accent (150ms). */
  .list-compact { border-top: 1px solid var(--rvt-border-default); }
  .list-compact li { border-bottom: 1px solid var(--rvt-border-default); }
  .list-compact li:last-child { border-bottom: 0; }
  .list-compact li:last-child a { padding-bottom: 0; }
  .list-compact a { display: flex; align-items: flex-start; gap: var(--rvt-spacing-4); padding: var(--rvt-spacing-12) 0; color: var(--rvt-text-strong);
    font: var(--rvt-font-action-lg-strong); font-stretch: var(--rvt-font-width-semi-expanded); text-underline-offset: 3px; transition: color .15s ease-out; }
  .list-compact .arrow-box { flex: none; display: flex; align-items: center; justify-content: center; width: 16px; height: 24px; color: var(--rvt-icon-strong); transition: color .15s ease-out; }
  .list-compact .label { flex: 1 1 auto; min-width: 0; }
  .list-compact a:hover { color: var(--rvt-text-accent); }
  .list-compact a:hover .label { text-decoration: underline; }
  .list-compact a:hover .arrow-box { color: var(--rvt-icon-accent); }

  /* =========================================================================
     rvt-text-essay, one column, Crimson (Text essay page)
     96px sticker spacing/32 below; eyebrow tag/md/caps spacing/12 below; title
     display/lg/strong spacing/48 below; body body/xl/regular; buttons spacing/48
     above, spacing/24 apart, centered. Bottom padding is 0 here: the image hub
     below continues the same crimson band (Figma Homepage).
     ========================================================================= */
  .essay .wrap { padding: 160px var(--rvt-spacing-80) 0; }
  .essay-inner { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
  .essay-inner > img { width: 96px; height: 96px; margin-bottom: var(--rvt-spacing-32); }
  .essay-inner .eyebrow { padding-bottom: var(--rvt-spacing-12); color: var(--rvt-text-brand); text-align: center; }
  .essay-inner h2 { color: var(--rvt-text-brand); text-align: center; padding-bottom: var(--rvt-spacing-48); }
  .essay-inner .t-body-xl { align-self: stretch; color: var(--rvt-text-default); }
  .essay-inner .actions-row { justify-content: center; gap: var(--rvt-spacing-24); padding-top: var(--rvt-spacing-48); }

  /* =========================================================================
     rvt-image-hub, Landscape (Image hub page)
     Images spacing/8 apart (rows and columns); caption tag/md/regular text/default,
     spacing/16 above.
     ========================================================================= */
  .image-hub .wrap { padding: var(--rvt-spacing-80) var(--gutter) 0; }
  .image-hub figure img { width: 100%; height: auto; object-fit: cover; object-position: var(--rvt-image-focus, 50% 0%); }
  .image-hub__main { aspect-ratio: 2 / 1; }
  .image-hub__secondary { display: grid; grid-template-columns: 1fr 1fr; gap: var(--rvt-spacing-8); padding-top: var(--rvt-spacing-8); }
  .image-hub__secondary img { aspect-ratio: 1 / 1; }
  .image-hub figcaption { padding-top: var(--rvt-spacing-16); color: var(--rvt-text-default); }

  /* =========================================================================
     rvt-quote, Default, Impact (Quote page)
     Quote icon 85 × 64 icon/brand; spacing/32 between icon, quote and name.
     Quote editorial/xl/regular; name body/sm/strong; title body/base/regular.
     ========================================================================= */
  .quote .wrap { display: flex; flex-direction: column; align-items: flex-start; gap: var(--rvt-spacing-32); padding: 160px var(--gutter); color: var(--rvt-text-brand); }
  .quote-mark { width: 85px; height: 64px; color: var(--rvt-icon-brand); }
  .quote-mark svg { width: 100%; height: 100%; overflow: visible; }
  .quote blockquote { max-width: 1160px; }

  /* =========================================================================
     rvt-list-hub, Hub with introduction, Default items (List hub page)
     Introduction to list spacing/64, side by side. Headline display/md/strong;
     intro body/md/regular, spacing/24 above. Items spacing/20 top and bottom,
     spacing/16 sides, 1px border/default under each item, none under the last;
     16px arrow spacing/8 to the title; title action/xl/strong-fixed text/strong.
     Hover: title text/accent + underline, arrow icon/accent.
     ========================================================================= */
  .quick-links .wrap { display: flex; align-items: flex-start; gap: var(--rvt-spacing-64); padding: 0 var(--gutter); }
  .quick-links .wrap > * { flex: 1 0 0; min-width: 0; }
  .quick-links h2 { color: var(--rvt-text-brand); }
  .quick-links .t-body-md { padding-top: var(--rvt-spacing-24); color: var(--rvt-text-default); }
  .list-hub { padding-top: var(--rvt-spacing-4); border-top: 1px solid var(--rvt-border-default); }
  .list-hub li { border-bottom: 1px solid var(--rvt-border-default); }
  .list-hub li:last-child { border-bottom: 0; }
  .list-hub a { display: flex; align-items: flex-start; gap: var(--rvt-spacing-8); padding: var(--rvt-spacing-20) var(--rvt-spacing-16); color: var(--rvt-text-strong);
    font: var(--rvt-font-action-xl-strong-fixed); font-stretch: var(--rvt-font-width-semi-expanded); transition: color .15s ease-out; }
  .list-hub li:last-child a { padding-bottom: 0; }
  .list-hub .arrow-box { display: flex; align-items: center; height: 24px; flex: none; color: var(--rvt-icon-strong); transition: color .15s ease-out; }
  .list-hub a:hover { color: var(--rvt-text-accent); }
  .list-hub a:hover .label { text-decoration: underline; }
  .list-hub a:hover .arrow-box { color: var(--rvt-icon-accent); }
  .list-hub a:focus-visible { outline-offset: -2px; }

  /* =========================================================================
     rvt-footer, Light (Footer page)
     Full width; 1px border/default on top of the footer and above the social row.
     Social row spacing/16 top and bottom, icons spacing/8 apart (rvt-link Social:
     24 × 24, border/accent, 12px icon/accent; hover border and icon accent-strong).
     Bottom bar spacing/16 bottom; 22 × 28 trident, spacing/24 to the legal links;
     legal links action/sm/regular, spacing/16 apart.
     Side padding: 24px, the header's inset (Sidebar Figma file).
     ========================================================================= */
  .site-footer { padding-top: var(--rvt-spacing-80); }
  .rvt-footer { background: var(--rvt-color-base-ultra-light); box-shadow: inset 0 1px 0 var(--rvt-border-default); }
  .footer-social { display: flex; gap: var(--rvt-spacing-8); padding: var(--rvt-spacing-16) 24px; }
  .footer-social a {
    display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;
    box-shadow: inset 0 0 0 1px var(--rvt-border-accent); color: var(--rvt-icon-accent);
    transition: box-shadow .15s ease-out, color .15s ease-out;
  }
  .footer-social a:hover { box-shadow: inset 0 0 0 1px var(--rvt-border-accent-strong); color: var(--rvt-icon-accent-strong); }
  .footer-social span { width: 12px; height: 12px; background: currentColor; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
  .footer-legal { display: flex; flex-wrap: wrap; align-items: center; gap: var(--rvt-spacing-24); padding: 0 24px var(--rvt-spacing-16); }
  .footer-legal > img { width: 22px; height: 28px; }
  .footer-legal ul { display: flex; flex-wrap: wrap; gap: var(--rvt-spacing-8) var(--rvt-spacing-16); color: var(--rvt-color-base-body); }
  .footer-legal a { transition: color .15s ease-out; }
  .footer-legal a:hover { color: var(--rvt-text-brand-strong); text-decoration: underline; }

  /* Interior placeholder page */
  .interior .wrap { padding: 64px var(--gutter) var(--section-y); }
  .interior .eyebrow { padding-bottom: var(--rvt-spacing-12); color: var(--rvt-text-brand); }
  .interior h1 { max-width: 920px; color: var(--rvt-text-brand); }
  .interior p { max-width: 920px; padding-top: var(--rvt-spacing-16); }
  .interior .list-compact { max-width: 600px; margin-top: var(--rvt-spacing-40); }

  /* =========================================================================
     NARROW DESKTOP (rail showing, content column under ~1020px)
     ========================================================================= */
  @media (min-width: 1024px) and (max-width: 1279.98px) {
    .stat-row .wrap { flex-wrap: wrap; }
    .stat-item, .stat-item:first-child, .stat-item:last-child { flex: 1 0 50%; padding: var(--rvt-spacing-48) var(--rvt-spacing-32) var(--rvt-spacing-48) 0; box-shadow: none; }
    .stat-item:nth-child(odd) { box-shadow: inset -1px 0 0 var(--rvt-border-default); }
    .stat-item:nth-child(even) { padding: var(--rvt-spacing-48) 0 var(--rvt-spacing-48) var(--rvt-spacing-32); }
    .stat-item:nth-child(1) { box-shadow: inset -1px 0 0 var(--rvt-border-default), inset 0 -1px 0 var(--rvt-border-default); }
    .stat-item:nth-child(2) { box-shadow: inset 0 -1px 0 var(--rvt-border-default); }
    .card-row { gap: var(--rvt-spacing-24); }
    .card-news { padding: var(--rvt-spacing-24); }
    .card-news__media { margin-bottom: var(--rvt-spacing-24); }
    .section--center .wrap, .essay .wrap { padding-inline: var(--gutter); }
    .callout { padding: var(--rvt-spacing-48); }
  }

  /* =========================================================================
     BELOW THE SIDENAV BREAKPOINT (1024px)
     The rail becomes a disclosure under the compact header: it opens in flow
     and pushes the page down (400ms). Parents drill; Back steps up a level.
     ========================================================================= */
  @media (max-width: 1023.98px) {
    :root { --gutter: 24px; }
    .site-header { flex-wrap: wrap; padding: 12px 16px 0; row-gap: 0; }
    .header-tools { display: contents; }
    .lockup { order: 1; margin-right: auto; }
    #search-toggle { order: 2; }
    #sidenav-open { display: flex; order: 3; }
    .header-ctas { order: 4; flex: 0 0 100%; justify-content: flex-end; padding: 16px 0 12px; }
    .tool-btn .icon { width: 12px; height: 12px; }
    .search-inner { padding: 16px; }
    .search-form { max-width: none; }

    #layout { display: block; }
    .rail { width: 100%; box-shadow: none; }
    #sidenav {
      position: relative; top: auto; z-index: 2;
      max-height: 0; overflow: hidden; padding: 0; visibility: hidden; pointer-events: none;
      transition: max-height 400ms var(--ease), box-shadow 400ms var(--ease);
    }
    #sidenav.is-open { visibility: visible; pointer-events: auto; box-shadow: 0 2px 6px 0 rgba(0, 0, 0, 0.15); }
    #sidenav-nav { padding: 44px 16px 8px; border-bottom: 1px solid transparent; }
    #sidenav-nav ul > li:last-child .sidenav-item { box-shadow: none; }
    #sidenav .sidenav-mobile-tools { display: flex; align-items: center; padding-bottom: 8px; }
    #sidenav .sidenav-mobile-tools .nav-btn-back { height: auto; font: var(--rvt-font-action-lg-strong); font-stretch: var(--rvt-font-width-semi-expanded); }
    #sidenav .sidenav-mobile-tools .nav-btn-back .icon { width: 16px; height: 16px; }
    #sidenav a.sidenav-title { color: var(--rvt-text-strong); font: var(--rvt-font-action-lg-strong); font-stretch: var(--rvt-font-width-semi-expanded); }
    #sidenav a.sidenav-title .sidenav-title-label { text-decoration: none; }
    #sidenav a.sidenav-title[aria-current="page"] { color: var(--rvt-text-accent); }
    #sidenav a.sidenav-title[aria-current="page"] .sidenav-title-label { text-decoration: underline; }
    #sidenav .sidenav-title-arrow { display: block; }

    .stat-row .wrap { flex-wrap: wrap; }
    .stat-item, .stat-item:first-child, .stat-item:last-child { flex: 1 0 50%; padding: var(--rvt-spacing-64) var(--rvt-spacing-32) var(--rvt-spacing-64) 0; box-shadow: inset 0 -1px 0 var(--rvt-border-default); }
    .stat-item:nth-last-child(-n+2) { box-shadow: none; }
    .section-head { flex-direction: column; align-items: flex-start; gap: var(--rvt-spacing-32); }
    .section-head-text { flex: none; width: 100%; }
    .card-row { flex-direction: column; gap: var(--rvt-spacing-24); }
    .callout-band .wrap { padding-bottom: var(--section-y); }
    .quick-links .wrap { flex-direction: column; gap: var(--rvt-spacing-32); }
    .quick-links .wrap > * { flex: none; width: 100%; }
    .interior .wrap { padding-top: 40px; }
  }

  /* =========================================================================
     MOBILE (under 768px): the token file switches spacing and type to their
     Mobile values here. These are the per-component Mobile rules from the guide.
     ========================================================================= */
  @media (max-width: 767px) {
    :root { --section-y: var(--rvt-spacing-64); }      /* 48px */
    /* Hero statement: spacing/40 top and bottom, spacing/24 sides; text block starts
       at the top padding; body spacing/20 above; card full width below the photo,
       spacing/8 above, sticker above the text. */
    .hero .wrap { padding: var(--rvt-spacing-40) var(--gutter); }
    .hero-text { padding: 0 0 var(--rvt-spacing-32); }
    .hero-intro { padding-top: var(--rvt-spacing-20); }
    .hero-media img { aspect-ratio: 327 / 200; }   /* Mobile single photo 327 × 200 */
    .hero-card { position: relative; width: 100%; margin-top: var(--rvt-spacing-8); flex-direction: column; }
    .hero-card p { padding-top: 0; }
    /* Stat group: stats run edge to edge at the 24px margin, one per row. */
    .stat-item, .stat-item:first-child, .stat-item:last-child { flex-basis: 100%; padding: var(--rvt-spacing-64) 0; }
    .stat-item:nth-last-child(2) { box-shadow: inset 0 -1px 0 var(--rvt-border-default); }
    .stat-note { padding-inline: var(--rvt-spacing-32); }
    /* Section intro: 24px gaps, centered text stacks. */
    .section .wrap, .section--news .wrap, .section--center .wrap { padding: var(--section-y) var(--gutter); gap: var(--rvt-spacing-32); }
    .section--center .section-head { gap: var(--rvt-spacing-32); }
    /* Feature card: spacing/32 top and sides (24px), spacing/64 bottom (48px); arrow box 32px. */
    .card-feature { --cf-pad: var(--rvt-spacing-32) var(--rvt-spacing-32) var(--rvt-spacing-64); }
    .card-feature__body > :last-child { padding-right: 0; }
    /* News card: spacing/24 padding and image gap. */
    .card-news { padding: var(--rvt-spacing-24); }
    .card-news__media { margin-bottom: var(--rvt-spacing-24); }
    /* Callout: spacing/32 (24px) top and sides, spacing/40 (32px) bottom; 64px sticker,
       spacing/20 to the text; links stacked, each hugging its label. */
    .callout { flex-direction: column; align-items: stretch; gap: var(--rvt-spacing-20); padding: var(--rvt-spacing-32) var(--rvt-spacing-32) var(--rvt-spacing-40); }
    .callout > img { width: 64px; height: 64px; }
    .callout-body { flex: none; max-width: none; padding-top: 0; }
    .callout-body .actions-row { flex-direction: column; align-items: flex-start; }
    /* Text essay, one column: spacing/64 top, 24px sides; 64px sticker spacing/20 below;
       title spacing/40 below; buttons spacing/40 above. */
    .essay .wrap { padding: var(--rvt-spacing-64) var(--gutter) 0; }
    .essay-inner > img { width: 64px; height: 64px; margin-bottom: var(--rvt-spacing-20); }
    .essay-inner h2 { padding-bottom: var(--rvt-spacing-40); }
    .essay-inner .actions-row { padding-top: var(--rvt-spacing-40); }
    .image-hub .wrap { padding-top: var(--section-y); }
    /* Quote, Impact: icon 53 × 40, spacing/32 (24px) gap. */
    .quote .wrap { padding: var(--section-y) var(--gutter); }
    .quote-mark { width: 53px; height: 40px; }
    /* List hub items: spacing/16 top and bottom, 0 sides. */
    .list-hub a { padding: var(--rvt-spacing-16) 0; }
    /* Footer: social row and legal links stack inside a bottom bar. */
    .footer-social { gap: var(--rvt-spacing-12); padding: var(--rvt-spacing-16) var(--gutter) var(--rvt-spacing-8); }
    .footer-legal { flex-direction: column-reverse; align-items: flex-start; gap: var(--rvt-spacing-20); padding: var(--rvt-spacing-8) var(--gutter) var(--rvt-spacing-16); }
    .footer-legal ul { flex-direction: column; gap: var(--rvt-spacing-8); }
  }
  @media (prefers-reduced-motion: reduce) {
    #sidenav, #search-panel, .rvt-link, .rvt-link .icon, .tool-btn, .list-compact a, .list-compact .arrow-box,
    .list-hub a, .list-hub .arrow-box, .footer-social a, .footer-legal a, .search-go { transition: none; }
  }
</style>
</head>

<body>
<a class="skip-link t-action-sm" href="#main-content">Skip to main content</a>

<script>
  /* =========================================================================
     BREAKPOINT
     1024px is where the left rail appears; below it the rail is the slide-down
     menu. Keep in step with the two media queries in the stylesheet.
     ========================================================================= */
  const SIDENAV_BREAKPOINT = 1024;

  /* =========================================================================
     IA
     Top-level labels are the eight items in the Figma sidenav.
     PLACEHOLDER: the Figma file only defines the top level. Every child below
     is a stand-in so the nesting can be exercised — replace with the real IA.
     ========================================================================= */
  const IA = [
    ['Academics', [
      ['Degrees & majors'],
      ['Schools', [['College of Arts and Sciences'], ['Kelley School of Business'], ['Jacobs School of Music'], ['Luddy School of Informatics, Computing, and Engineering']]],
      ['Online programs'],
      ['Study abroad'],
      ['Libraries'],
    ]],
    ['Admissions', [['First-year students'], ['Transfer students'], ['International students'], ['Graduate & professional'], ['Visit campus']]],
    ['Cost & Aid', [['Tuition & fees'], ['Scholarships'], ['Financial aid'], ['Net price calculator']]],
    ['Campus Life', [
      ['Housing & dining', [['Residence halls'], ['Dining'], ['Living learning communities']]],
      ['Student organizations'],
      ['Arts & culture'],
      ['Athletics & recreation'],
      ['Bloomington'],
    ]],
    ['Research', [['Centers & institutes'], ['Undergraduate research'], ['Research impact']]],
    ['Student Support', [['Academic advising'], ['Career services'], ['Health & wellness'], ['Accessibility']]],
    ['Alumni & Giving', [['Alumni association'], ['Give to IU']]],
    ['About', [['Leadership'], ['History & traditions'], ['Rankings & facts'], ['Contact']]],
  ];

  const HOME = 'index';
  const PAGES = { [HOME]: { l: 'Home', t: 'Indiana University Bloomington', p: null, c: [] } };
  const slugify = (s) => s.toLowerCase().replace(/&/g, ' ').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  (function build(list, parent) {
    for (const [label, kids] of list) {
      const slug = slugify(label);
      PAGES[slug] = { l: label, t: label + ' | Indiana University Bloomington', p: parent, c: [] };
      PAGES[parent].c.push(slug);
      if (kids) build(kids, slug);
    }
  })(IA, HOME);

  /* =========================================================================
     ICONS — Rivet outlines (16px box unless noted), exported from the Figma file
     ========================================================================= */
  const ICONS = {
    'chevron-right': ['0 0 16 16', 'M6.26341 15.1459L12.31 8L6.26341 0.854065L4.73663 2.14595L9.69007 8L4.73663 13.8541L6.26341 15.1459Z'],
    'arrow-right': ['0 0 16 16', 'M1 7h10.844L7.737 2.146 9.263.854 15.31 8l-6.047 7.146-1.526-1.292L11.844 9H1V7Z'],
    'arrow-left': ['0 0 16 16', 'M15 7H4.156l4.107-4.854L6.737.854.69 8l6.047 7.146 1.526-1.292L4.156 9H15V7Z'],
    'arrow-up-right': ['0 0 16 16', 'M10.5858 4L4 4V2L14 2L14 12H12L12 5.41421L3.70711 13.7071L2.29289 12.2929L10.5858 4Z'],
    'arrow-right-12': ['0 0 12 12', 'M10.998 6L6.34766 11.5195L4.81836 10.2305L7.53906 7H1V5H7.53906L4.81836 1.76953L6.34766 0.480469L10.998 6Z'],
    'magnifying-glass': ['0 0 16 16', 'M7 2a5 5 0 1 0 0 10A5 5 0 0 0 7 2ZM0 7a7 7 0 1 1 12.606 4.192l3.101 3.1-1.414 1.415-3.1-3.1A7 7 0 0 1 0 7Z'],
    menu: ['0 0 16 16', 'M15 4H1V2H15V4ZM15 9H1V7H15V9ZM1 14H15V12H1V14Z'],
    close: ['0 0 16 16', 'm3.5 2.086 4.5 4.5 4.5-4.5L13.914 3.5 9.414 8l4.5 4.5-1.414 1.414-4.5-4.5-4.5 4.5L2.086 12.5l4.5-4.5-4.5-4.5L3.5 2.086Z'],
  };
  const icon = (name) => {
    const i = ICONS[name];
    return i ? `<svg viewBox="${i[0]}" aria-hidden="true" focusable="false"><path d="${i[1]}"/></svg>` : '';
  };
  function paintIcons(root) {
    for (const el of root.querySelectorAll('[data-icon]')) {
      if (!el.firstChild) el.innerHTML = icon(el.dataset.icon);
    }
  }

  /* =========================================================================
     HELPERS
     ========================================================================= */
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const href = (slug) => (slug === HOME ? '#/' : '#/' + slug);
  const hasKids = (slug) => (PAGES[slug].c || []).length > 0;
  function ancestry(slug) {
    const chain = [];
    for (let s = slug; s; s = PAGES[s].p) chain.unshift(s);
    return chain;
  }
  /** A page with children shows its own children; a leaf shows its siblings. */
  const sectionOf = (slug) => (hasKids(slug) ? slug : PAGES[slug].p);
  const desktopView = window.matchMedia(`(min-width: ${SIDENAV_BREAKPOINT}px)`);

  /* =========================================================================
     SIDENAV (ported from sidebar-v2-children)
     A page with children lists those children; a leaf lists its siblings.
     Home, and any page whose section is Home, keeps the top-level list in the
     bold main-nav style. The current row is crimson and underlined, with no
     chevron. Other parents keep a right chevron. Desktop rows navigate. Below
     1024 the same rows drill in the slide-down panel (a parent does not
     navigate) and Back steps up one level.
     ========================================================================= */
  function navModel(slug) {
    const isHome = slug === HOME || !PAGES[slug];
    if (isHome) return { items: PAGES[HOME].c, back: null, current: null, top: true };
    const section = sectionOf(slug);
    if (!section || section === HOME) return { items: PAGES[HOME].c, back: null, current: slug, top: true };
    const parent = PAGES[slug].p;
    return {
      items: PAGES[section].c,
      back: parent ? { slug: parent, label: PAGES[parent].l } : null,
      current: slug === section ? null : slug,
      top: false,
    };
  }

  function sidenavRow(s, current, top, drill) {
    const page = PAGES[s];
    const isCurrent = s === current;
    const kids = hasKids(s);
    const chev = kids && !isCurrent ? `<span class="icon sidenav-chevron" data-icon="chevron-right" aria-hidden="true"></span>` : '';
    const label = `<span class="sidenav-item-label ${top ? 'is-parent' : 'is-child'}">${esc(page.l)}</span>`;
    const cls = `sidenav-item${isCurrent ? ' is-current' : ''}`;
    const control = drill && kids
      ? `<button type="button" data-sidenav-down="${esc(s)}" class="${cls}">${label}${chev}</button>`
      : `<a data-nav href="${href(s)}"${isCurrent ? ' aria-current="page"' : ''} class="${cls}">${label}${chev}</a>`;
    return `<li>${control}</li>`;
  }

  function sidenavBack(back, drillUp) {
    if (!back) return '';
    const inner = `<span class="icon" data-icon="arrow-left"></span><span class="t-action-sm">${esc(back.label)}</span>`;
    return drillUp
      ? `<button type="button" data-sidenav-up class="nav-btn-back">${inner}</button>`
      : `<a data-nav href="${href(back.slug)}" class="nav-btn-back">${inner}</a>`;
  }

  let mobileSidenavOpen = false;
  let mobileStack = [];

  function renderSidenav(slug) {
    if (mobileSidenavOpen && !desktopView.matches) return renderMobileSidenav(slug);
    const model = navModel(slug);
    const items = model.items.map((s) => sidenavRow(s, model.current, model.top, false)).join('');
    const back = sidenavBack(model.back, false);
    const section = !model.top && PAGES[slug] ? sectionOf(slug) : null;
    const onSection = !!(section && slug === section);
    const title = section
      ? `<a data-nav href="${href(section)}" class="sidenav-title"${onSection ? ' aria-current="page"' : ''}>` +
        `<span class="sidenav-title-label">${esc(PAGES[section].l)}</span></a>`
      : '';
    return back + `<div class="${model.back ? 'sidenav-after-back' : ''}">${title}<ul>${items}</ul></div>`;
  }

  function renderMobileSidenav(slug) {
    const current = PAGES[slug] ? slug : HOME;
    if (mobileStack.length === 0) {
      return `<div><ul>${PAGES[HOME].c.map((s) => sidenavRow(s, current, true, true)).join('')}</ul></div>`;
    }
    const section = mobileStack[mobileStack.length - 1];
    const parentSlug = mobileStack.length >= 2 ? mobileStack[mobileStack.length - 2] : (PAGES[section].p || HOME);
    const back = sidenavBack({ slug: parentSlug, label: PAGES[parentSlug].l }, true);
    const onSection = current === section;
    const title =
      `<a data-nav href="${href(section)}" class="sidenav-title"${onSection ? ' aria-current="page"' : ''}>` +
      `<span class="sidenav-title-label">${esc(PAGES[section].l)}</span>` +
      `<span class="icon sidenav-title-arrow" data-icon="arrow-right" aria-hidden="true"></span></a>`;
    const items = PAGES[section].c.map((s) => sidenavRow(s, current, false, true)).join('');
    return `<div class="sidenav-mobile-tools">${back}</div><div class="sidenav-after-back">${title}<ul>${items}</ul></div>`;
  }

  /* =========================================================================
     PAGES
     ========================================================================= */
  function renderInterior(slug, p) {
    const parent = PAGES[p.p];
    const kids = p.c.map((s) =>
      `<li><a data-nav href="${href(s)}"><span class="arrow-box"><span class="icon-12" data-icon="arrow-right-12"></span></span><span class="label">${esc(PAGES[s].l)}</span></a></li>`
    ).join('');
    return (
      `<section class="interior"><div class="wrap">` +
      (parent && p.p !== HOME ? `<p class="eyebrow t-tag-sm-caps">${esc(parent.l)}</p>` : '') +
      `<h1 class="t-display-md">${esc(p.l)}</h1>` +
      `<p class="t-body-base">Placeholder page. The design for this page has not been built yet.</p>` +
      (kids ? `<ul class="list-compact">${kids}</ul>` : '') +
      `</div></section>`
    );
  }

  /* =========================================================================
     SLIDE-DOWN PANELS (menu below 1024, search at every size)
     max-height is set from scrollHeight so the panel stays in flow and the
     page moves with it. 400ms, one ease for open and close.
     ========================================================================= */
  const sidenav = document.getElementById('sidenav');
  const sidenavNav = document.getElementById('sidenav-nav');
  const sidenavOpenBtn = document.getElementById('sidenav-open');
  const searchPanel = document.getElementById('search-panel');
  const searchToggle = document.getElementById('search-toggle');
  const main = document.getElementById('main-content');
  const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tokens = new WeakMap();

  function fitPanel(el, open, isOpen) {
    const token = (tokens.get(el) || 0) + 1;
    tokens.set(el, token);
    const live = () => tokens.get(el) === token;
    if (!open) {
      if (reduceMotion()) { el.style.visibility = ''; el.style.maxHeight = '0px'; return; }
      el.style.visibility = 'visible';
      window.setTimeout(() => { if (live() && !isOpen()) el.style.visibility = ''; }, 400);
      requestAnimationFrame(() => { if (live() && !isOpen()) el.style.maxHeight = '0px'; });
      return;
    }
    el.style.visibility = 'visible';
    const apply = () => { if (live() && isOpen()) el.style.maxHeight = el.scrollHeight + 'px'; };
    if (!reduceMotion() && (el.style.maxHeight === '' || el.style.maxHeight === '0px')) {
      el.style.maxHeight = '0px';
      requestAnimationFrame(apply);
      return;
    }
    apply();
  }

  function syncMobileSidenavHidden() {
    const hide = !desktopView.matches && !mobileSidenavOpen;
    if (desktopView.matches) { sidenav.style.maxHeight = ''; sidenav.style.visibility = ''; }
    sidenav.toggleAttribute('inert', hide);
    if (hide) sidenav.setAttribute('aria-hidden', 'true');
    else sidenav.removeAttribute('aria-hidden');
  }

  function paintSidenav() {
    sidenavNav.innerHTML = renderSidenav(currentSlug());
    paintIcons(sidenavNav);
  }

  function stackForCurrentPage() {
    const section = sectionOf(currentSlug());
    return section ? ancestry(section).filter((s) => s !== HOME) : [];
  }

  function openMobileSidenav() {
    if (desktopView.matches) return;
    if (searchOpen) closeSearch();
    window.scrollTo(0, 0);
    mobileSidenavOpen = true;
    mobileStack = stackForCurrentPage();
    paintSidenav();
    sidenav.classList.add('is-open');
    sidenavOpenBtn.setAttribute('aria-expanded', 'true');
    sidenavOpenBtn.querySelector('.sr-only').textContent = 'Close';
    syncMobileSidenavHidden();
    fitPanel(sidenav, true, () => mobileSidenavOpen);
  }

  function closeMobileSidenav() {
    if (!mobileSidenavOpen) return;
    mobileSidenavOpen = false;
    sidenav.classList.remove('is-open');
    sidenavOpenBtn.setAttribute('aria-expanded', 'false');
    sidenavOpenBtn.querySelector('.sr-only').textContent = 'Menu';
    syncMobileSidenavHidden();
    fitPanel(sidenav, false, () => mobileSidenavOpen);
    if (sidenav.contains(document.activeElement)) sidenavOpenBtn.focus();
  }

  sidenavOpenBtn.addEventListener('click', () => (mobileSidenavOpen ? closeMobileSidenav() : openMobileSidenav()));
  sidenavNav.addEventListener('click', (e) => {
    const down = e.target.closest('[data-sidenav-down]');
    if (down) mobileStack.push(down.dataset.sidenavDown);
    else if (e.target.closest('[data-sidenav-up]')) mobileStack.pop();
    else return;
    paintSidenav();
    fitPanel(sidenav, true, () => mobileSidenavOpen);
    const first = sidenavNav.querySelector('button, a');
    if (first) first.focus();
  });

  let searchOpen = false;
  function openSearch() {
    if (mobileSidenavOpen) closeMobileSidenav();
    searchOpen = true;
    searchPanel.classList.add('is-open');
    searchPanel.removeAttribute('inert');
    searchToggle.setAttribute('aria-expanded', 'true');
    searchToggle.querySelector('.sr-only').textContent = 'Close search';
    fitPanel(searchPanel, true, () => searchOpen);
    document.getElementById('site-search').focus({ preventScroll: true });
  }
  function closeSearch() {
    if (!searchOpen) return;
    searchOpen = false;
    searchPanel.classList.remove('is-open');
    searchPanel.setAttribute('inert', '');
    searchToggle.setAttribute('aria-expanded', 'false');
    searchToggle.querySelector('.sr-only').textContent = 'Search';
    if (searchPanel.contains(document.activeElement)) searchToggle.focus();
    fitPanel(searchPanel, false, () => searchOpen);
  }
  searchPanel.setAttribute('inert', '');
  searchToggle.addEventListener('click', () => (searchOpen ? closeSearch() : openSearch()));
  /* No backend in the prototype; submit is swallowed. */
  document.getElementById('site-search-form').addEventListener('submit', (e) => e.preventDefault());

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const t = e.target;
    if (t && t.tagName === 'INPUT' && t.type === 'search' && t.value.length > 0) return;
    if (mobileSidenavOpen) closeMobileSidenav();
    else if (searchOpen) closeSearch();
  });

  desktopView.addEventListener('change', (e) => {
    if (e.matches) closeMobileSidenav();
    syncMobileSidenavHidden();
    paintSidenav();
  });

  /* The rail sticks under the header, whatever height the header is. */
  const chrome = document.querySelector('.chrome');
  const syncChromeHeight = () => document.documentElement.style.setProperty('--chrome-h', chrome.offsetHeight + 'px');
  new ResizeObserver(syncChromeHeight).observe(chrome);
  syncChromeHeight();

  /* =========================================================================
     ROUTER — "#/" is Home, "#/<slug>" is any other page.
     ========================================================================= */
  function currentSlug() {
    const h = location.hash;
    if (!h || h === '#' || h === '#/') return HOME;
    if (!h.startsWith('#/')) return null;
    const slug = decodeURIComponent(h.slice(2)).replace(/\/$/, '');
    return PAGES[slug] ? slug : HOME;
  }

  function render() {
    const slug = currentSlug();
    if (slug === null) return;
    const p = PAGES[slug];
    document.title = p.t;
    sidenav.setAttribute('aria-label', slug === HOME ? 'Menu' : p.l);
    paintSidenav();
    if (slug === HOME) {
      main.replaceChildren(document.getElementById('tpl-home').content.cloneNode(true));
    } else {
      main.innerHTML = renderInterior(slug, p);
    }
    paintIcons(main);
  }

  // Any in-app link closes the open panels and scrolls to top; the hash change
  // does the routing. Parents in the mobile menu are buttons, so they drill
  // without reaching this handler.
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-nav]');
    if (!a) return;
    if (searchOpen) closeSearch();
    if (mobileSidenavOpen) closeMobileSidenav();
    if (a.getAttribute('href') === location.hash) { e.preventDefault(); return; }
    window.scrollTo(0, 0);
  });

  document.querySelector('.skip-link').addEventListener('click', (e) => {
    e.preventDefault();
    main.setAttribute('tabindex', '-1');
    main.focus();
  });

  window.addEventListener('hashchange', render);
  paintIcons(document);
  syncMobileSidenavHidden();
  render();
</script>
</body>
</html>
